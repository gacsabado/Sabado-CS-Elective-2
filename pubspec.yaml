name: prelim_exam
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.0.0
  flutter_svg: ^2.0.10
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
  provider: ^6.1.5+1
  google_sign_in: ^7.2.0
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.9.3

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/Pop_Mart_logo.svg
    - assets/HIRONO.webp
    - assets/afterdark.jpeg
    - assets/roadjournal.jpeg
    - assets/gray.jpeg
    - assets/shelter.jpg
    - assets/littlemischief.jpg
    - assets/plush.jpg
    - assets/reshape.jpg
    
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/app_icon.png"

  web:
    generate: true
    image_path: "assets/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"